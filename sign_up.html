<!DOCTYPE html>
<html>

<head>
    <title>Sign Up Page</title>
    <link rel="stylesheet" href="styleing.css">
</head>

<body>

    <h1 id="main">Sign Up</h1>
    <h3>Enter details</h3>

    <form class="sign-up" action="/register" method="POST">

        <input
            type="text"
            name="username"
            placeholder="Username"
            required
        >
        <br><br>

        <input
            type="email"
            name="email"
            placeholder="Email"
            required
        >
        <br><br>

        <input
            type="password"
            name="password"
            placeholder="Password"
            required
        >
        <br><br>

        <button type="submit">Sign Up</button>

    </form>

    <script src="code.js"></script>

</body>

</html>
